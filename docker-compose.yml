# One-command startup: `docker compose up`
# Brings up the gateway (FastAPI + Discord bot) and the dashboard (Next.js dev server).
# Prereqs: .env in the repo root and dashboard/.env.local filled in.

services:
  gateway:
    build: .
    container_name: agentgate-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  dashboard:
    image: node:24-alpine
    container_name: agentgate-dashboard
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./dashboard/.env.local
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- -H 0.0.0.0"
    restart: unless-stopped
    depends_on:
      - gateway

volumes:
  dashboard_node_modules:

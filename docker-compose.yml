# Production / user-facing compose file.
# Uses the published Docker Hub image — no source code needed.
#
# Usage:
#   1. Copy .env.example to .env and fill in your values
#   2. Create dashboard/.env.local with your Supabase keys
#   3. docker compose up

services:
  gateway:
    image: bastionsdkteam/bastion-gateway:latest   # replace with your Docker Hub username
    container_name: bastion-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  dashboard:
    image: node:20.9.0-alpine
    container_name: bastion-dashboard
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./dashboard/.env.local
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- -H 0.0.0.0"
    restart: unless-stopped
    depends_on:
      - gateway

volumes:
  dashboard_node_modules:

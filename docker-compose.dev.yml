# Development compose — builds gateway from local source.
# Usage: docker compose -f docker-compose.dev.yml up

services:
  gateway:
    build: .
    container_name: bastion-gateway-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./gateway:/app/gateway
      - ./bastion_sdk:/app/bastion_sdk
    restart: unless-stopped

  dashboard:
    image: node:20.9.0-alpine
    container_name: bastion-dashboard-dev
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./dashboard/.env.local
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- -H 0.0.0.0"
    depends_on:
      - gateway

volumes:
  dashboard_node_modules:

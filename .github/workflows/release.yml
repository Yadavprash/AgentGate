# Triggered by pushing a version tag: git tag v1.0.1 && git push --tags
# Publishes:
#   1. bastion-sdk to PyPI
#   2. bastion-gateway Docker image to Docker Hub (tagged :1.0.1 and :latest)
#
# Required GitHub secrets (Settings → Secrets → Actions):
#   PYPI_TOKEN          — PyPI API token (pypi.org → Account Settings → API tokens)
#   DOCKERHUB_USERNAME  — your Docker Hub username
#   DOCKERHUB_TOKEN     — Docker Hub access token (hub.docker.com → Security)

name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ── 1. Publish Python SDK to PyPI ──────────────────────────────────────────
  publish-sdk:
    name: Publish SDK to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

  # ── 2. Build and push Docker image to Docker Hub ───────────────────────────
  publish-docker:
    name: Publish Gateway to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bastion-gateway:${{ steps.version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bastion-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
